<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservation - DineEase</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container bar">
      <a class="logo" href="index.html">DineEase</a>
      <button id="burger" aria-label="Menu">&#9776;</button>
      <nav id="nav">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="about.html">About Us</a>
        <a href="reservation.html">Reservation</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
        <a href="orders.html">My Orders</a>
        <span id="auth-links">
          <a href="login.html">Login</a>
          <a class="btn small" href="register.html">Register</a>
        </span>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="form-box">
      <h1>Book a table</h1>
      <p>Choose a date and time. We will confirm shortly.</p>

      <form id="reservation-form" novalidate>
        <label>Date
          <input type="date" id="date">
        </label>
        <label>Time
          <input type="time" id="time">
        </label>
        <label>Guests
          <input type="number" id="guests" min="1" max="20" value="2">
        </label>

        <div id="message" class="msg"></div>
        <button type="submit" class="btn">Book Table</button>
      </form>
    </div>

    <h2 class="section-title">My reservations</h2>
    <div id="my-reservations">Loading...</div>
  </main>

  <footer>
    <div class="container">
      <strong>DineEase</strong> &middot; Open daily 11:00 AM - 11:00 PM &middot; Zindabazar, Sylhet &middot; 01700-000000
    </div>
  </footer>

  <script>
    // Live server address. When testing on this computer, use the local server.
    let API_URL = "https://dineease-api.onrender.com";

    if (location.protocol === "file:" || location.hostname === "localhost") {
      API_URL = "http://localhost:5000";
    }

    const authLinks = document.getElementById("auth-links");

    // Menu button on small screens
    document.getElementById("burger").onclick = function () {
      document.getElementById("nav").classList.toggle("show");
    };

    // If the user is logged in, show the name and a logout button
    function showAuthLinks() {
      const savedUser = localStorage.getItem("user");

      if (!savedUser) {
        return;
      }

      const user = JSON.parse(savedUser);
      const hello = document.createElement("span");
      const logout = document.createElement("button");

      hello.textContent = "Hi, " + user.name;
      logout.textContent = "Logout";
      logout.className = "btn small";

      logout.onclick = function () {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "login.html";
      };

      authLinks.innerHTML = "";
      authLinks.appendChild(hello);
      authLinks.appendChild(logout);
    }

    // The cart is kept in the browser as a list of items
    function getCart() {
      const saved = localStorage.getItem("cart");

      if (!saved) {
        return [];
      }

      return JSON.parse(saved);
    }

    function saveCart(cart) {
      localStorage.setItem("cart", JSON.stringify(cart));
      updateCartCount();
    }

    // Show the total number of items next to the Cart link
    function updateCartCount() {
      const cart = getCart();
      let count = 0;

      for (let i = 0; i < cart.length; i++) {
        count = count + cart[i].quantity;
      }

      document.getElementById("cart-count").textContent = count;
    }

    const message = document.getElementById("message");
    const dateInput = document.getElementById("date");
    const myReservations = document.getElementById("my-reservations");

    // The date cannot be before today
    const now = new Date();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");
    dateInput.min = now.getFullYear() + "-" + month + "-" + day;

    function showMessage(text, isError) {
      message.textContent = text;
      message.className = isError ? "msg error" : "msg success";
    }

    function makeReservationCard(item) {
      const card = document.createElement("div");
      const head = document.createElement("div");
      const title = document.createElement("span");
      const status = document.createElement("span");
      const info = document.createElement("small");

      card.className = "order-card";
      head.className = "order-head";
      title.textContent = "Table for " + item.guests;
      status.className = "status";
      status.textContent = item.status;
      head.append(title, status);

      info.textContent = item.date + " at " + item.time;
      card.append(head, info);
      return card;
    }

    async function loadReservations() {
      const token = localStorage.getItem("token");

      if (!token) {
        myReservations.innerHTML = '<p>Please <a href="login.html">login</a> to book a table and see your reservations.</p>';
        return;
      }

      try {
        const response = await fetch(API_URL + "/api/reservations/my", {
          headers: { "Authorization": "Bearer " + token },
        });

        if (response.status === 401) {
          myReservations.innerHTML = '<p>Your login has expired. Please <a href="login.html">login</a> again.</p>';
          return;
        }

        const items = await response.json();
        myReservations.innerHTML = "";

        if (items.length === 0) {
          myReservations.textContent = "You have no reservations yet.";
          return;
        }

        for (let i = 0; i < items.length; i++) {
          myReservations.appendChild(makeReservationCard(items[i]));
        }
      } catch (error) {
        myReservations.textContent = "Could not load your reservations";
      }
    }

    document.getElementById("reservation-form").addEventListener("submit", async function (event) {
      event.preventDefault();

      const token = localStorage.getItem("token");
      const date = dateInput.value;
      const time = document.getElementById("time").value;
      const guests = Number(document.getElementById("guests").value);

      if (!token) {
        showMessage("Please login first to book a table", true);
        return;
      }

      if (date === "") {
        showMessage("Please choose a date", true);
        return;
      }

      if (time === "") {
        showMessage("Please choose a time", true);
        return;
      }

      if (!Number.isInteger(guests) || guests < 1 || guests > 20) {
        showMessage("Guests must be between 1 and 20", true);
        return;
      }

      showMessage("Sending your request...", false);

      try {
        const response = await fetch(API_URL + "/api/reservations", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token,
          },
          body: JSON.stringify({ date: date, time: time, guests: guests }),
        });
        const data = await response.json();

        if (!response.ok) {
          showMessage(data.message, true);
          return;
        }

        showMessage("Table request sent! We will confirm soon.", false);
        loadReservations();
      } catch (error) {
        showMessage("Could not reach the server. Please try again.", true);
      }
    });

    showAuthLinks();
    updateCartCount();
    loadReservations();
  </script>
</body>
</html>
