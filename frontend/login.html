<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - DineEase</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container bar">
      <a class="logo" href="menu.html">DineEase</a>
      <button id="burger" aria-label="Menu">&#9776;</button>
      <nav id="nav">
        <a href="menu.html">Menu</a>
        <a href="about.html">About Us</a>
        <a href="reservation.html">Reservation</a>
        <a href="contact.html">Contact</a>
        <span id="auth-links">
          <a href="login.html">Login</a>
          <a class="btn small" href="register.html">Register</a>
        </span>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="form-box">
      <h1>Welcome back</h1>
      <p>Login to order food and book tables.</p>

      <form id="login-form" novalidate>
        <label>Email
          <input type="email" id="email" placeholder="you@example.com">
        </label>
        <label>Password
          <input type="password" id="password" placeholder="Your password">
        </label>

        <div id="message" class="msg"></div>
        <button type="submit" class="btn">Login</button>
      </form>

      <p class="form-note">New here? <a href="register.html">Create an account</a></p>
    </div>
  </main>

  <script>
    // Live server address. When testing on this computer, use the local server.
    let API_URL = "https://dineease-api.onrender.com";

    if (location.protocol === "file:" || location.hostname === "localhost") {
      API_URL = "http://localhost:5000";
    }

    const authLinks = document.getElementById("auth-links");
    const message = document.getElementById("message");

    // Menu button on small screens
    document.getElementById("burger").onclick = function () {
      document.getElementById("nav").classList.toggle("show");
    };

    // If the user is logged in, show the name and a logout button
    function showAuthLinks() {
      const savedUser = localStorage.getItem("user");

      if (!savedUser) {
        return;
      }

      const user = JSON.parse(savedUser);
      const hello = document.createElement("span");
      const logout = document.createElement("button");

      hello.textContent = "Hi, " + user.name;
      logout.textContent = "Logout";
      logout.className = "btn small";

      logout.onclick = function () {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "login.html";
      };

      authLinks.innerHTML = "";
      authLinks.appendChild(hello);
      authLinks.appendChild(logout);
    }

    function showMessage(text, isError) {
      message.textContent = text;
      message.className = isError ? "msg error" : "msg success";
    }

    document.getElementById("login-form").addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (email === "" || password === "") {
        showMessage("Please enter your email and password", true);
        return;
      }

      showMessage("Please wait...", false);

      try {
        const response = await fetch(API_URL + "/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, password: password }),
        });
        const data = await response.json();

        if (!response.ok) {
          showMessage(data.message, true);
          return;
        }

        // Keep the token so the other pages know who is logged in
        localStorage.setItem("token", data.token);
        localStorage.setItem("user", JSON.stringify(data.user));

        window.location.href = "menu.html";
      } catch (error) {
        showMessage("Could not reach the server. Please try again.", true);
      }
    });

    showAuthLinks();
  </script>
</body>
</html>
