<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Orders - DineEase</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container bar">
      <a class="logo" href="index.html">DineEase</a>
      <button id="burger" aria-label="Menu">&#9776;</button>
      <nav id="nav">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="about.html">About Us</a>
        <a href="reservation.html">Reservation</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
        <a href="orders.html">My Orders</a>
        <span id="auth-links">
          <a href="login.html">Login</a>
          <a class="btn small" href="register.html">Register</a>
        </span>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">My Orders</h1>
    <p class="page-sub">Your order history</p>

    <div id="orders-list">Loading...</div>
  </main>

  <footer>
    <div class="container">
      <strong>DineEase</strong> &middot; Open daily 11:00 AM - 11:00 PM &middot; Zindabazar, Sylhet &middot; 01700-000000
    </div>
  </footer>

  <script>
    // Live server address. When testing on this computer, use the local server.
    let API_URL = "https://dineease-api.onrender.com";

    if (location.protocol === "file:" || location.hostname === "localhost") {
      API_URL = "http://localhost:5000";
    }

    const authLinks = document.getElementById("auth-links");

    // Menu button on small screens
    document.getElementById("burger").onclick = function () {
      document.getElementById("nav").classList.toggle("show");
    };

    // If the user is logged in, show the name and a logout button
    function showAuthLinks() {
      const savedUser = localStorage.getItem("user");

      if (!savedUser) {
        return;
      }

      const user = JSON.parse(savedUser);
      const hello = document.createElement("span");
      const logout = document.createElement("button");

      hello.textContent = "Hi, " + user.name;
      logout.textContent = "Logout";
      logout.className = "btn small";

      logout.onclick = function () {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "login.html";
      };

      authLinks.innerHTML = "";
      authLinks.appendChild(hello);
      authLinks.appendChild(logout);
    }

    // The cart is kept in the browser as a list of items
    function getCart() {
      const saved = localStorage.getItem("cart");

      if (!saved) {
        return [];
      }

      return JSON.parse(saved);
    }

    function saveCart(cart) {
      localStorage.setItem("cart", JSON.stringify(cart));
      updateCartCount();
    }

    // Show the total number of items next to the Cart link
    function updateCartCount() {
      const cart = getCart();
      let count = 0;

      for (let i = 0; i < cart.length; i++) {
        count = count + cart[i].quantity;
      }

      document.getElementById("cart-count").textContent = count;
    }

    const ordersList = document.getElementById("orders-list");

    function makeOrderCard(order) {
      const card = document.createElement("div");
      const head = document.createElement("div");
      const title = document.createElement("span");
      const status = document.createElement("span");
      const list = document.createElement("ul");
      const total = document.createElement("strong");
      const info = document.createElement("div");

      card.className = "order-card";
      head.className = "order-head";
      title.textContent = "Order #" + order.id;
      status.className = "status";
      status.textContent = order.status;
      head.append(title, status);

      for (let i = 0; i < order.items.length; i++) {
        const item = order.items[i];
        const line = document.createElement("li");
        line.textContent = item.name + " x " + item.quantity + " - Tk " + Number(item.price) * item.quantity;
        list.appendChild(line);
      }

      total.textContent = "Total: Tk " + Number(order.total);

      info.innerHTML = "<small></small>";
      info.firstChild.textContent = new Date(order.created_at).toLocaleString() + " | " + order.address;

      card.append(head, list, total, info);
      return card;
    }

    async function loadOrders() {
      const token = localStorage.getItem("token");

      if (!token) {
        ordersList.innerHTML = '<p>Please <a href="login.html">login</a> to see your orders.</p>';
        return;
      }

      try {
        const response = await fetch(API_URL + "/api/orders/my", {
          headers: { "Authorization": "Bearer " + token },
        });

        if (response.status === 401) {
          ordersList.innerHTML = '<p>Your login has expired. Please <a href="login.html">login</a> again.</p>';
          return;
        }

        const orders = await response.json();
        ordersList.innerHTML = "";

        if (orders.length === 0) {
          ordersList.innerHTML = '<p>You have no orders yet. <a href="menu.html">Order something tasty</a></p>';
          return;
        }

        for (let i = 0; i < orders.length; i++) {
          ordersList.appendChild(makeOrderCard(orders[i]));
        }
      } catch (error) {
        ordersList.textContent = "Could not load your orders";
      }
    }

    showAuthLinks();
    updateCartCount();
    loadOrders();
  </script>
</body>
</html>
